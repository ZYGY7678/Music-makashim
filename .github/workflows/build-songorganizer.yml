name: Build SongOrganizer (Windows)

on:
  push:
    branches: [ songorganizer-build-20261004 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download LLVM-MinGW
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/20260922/llvm-mingw-20260922-msvcrt-x86_64.zip" -OutFile "$env:RUNNER_TEMP\\llvm-mingw.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\\llvm-mingw.zip" -DestinationPath "$env:RUNNER_TEMP\\llvm-mingw"
      - name: Compile
        shell: pwsh
        run: |
          $root = Get-ChildItem "$env:RUNNER_TEMP\\llvm-mingw" -Directory | Select-Object -First 1
          & "$($root.FullName)\\bin\\x86_64-w64-mingw32-clang.exe" -O2 -mwindows -municode SongOrganizer.c -o SongOrganizer.exe -lcomctl32 -lpropsys -lwinhttp -lshell32 -lshlwapi -lole32 -loleaut32 -luuid -luser32 -lgdi32 -lcomdlg32 -ladvapi32 -lmsimg32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item SongOrganizer.exe | Format-List Name,Length,FullName
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: SongOrganizer-Windows
          path: SongOrganizer.exe
